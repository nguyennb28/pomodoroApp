[project]
name = "pomodoro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nguyennb28", email = "nguyennb.coding@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyqt6>=6.11.0",
]

[project.scripts]
pomodoro = "pomodoro.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
